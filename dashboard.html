<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vex</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a10;
  --panel: #12131c;
  --panel-2: #181925;
  --border: rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.13);
  --text: #eceef5;
  --text-dim: #8a8ea3;
  --text-faint: #4b4e63;
  --accent: #8b7cf6;
  --accent2: #f6a56b;
  --ok: #7fd8a6;
  --danger: #f65b5b;
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  height: 100vh;
  overflow: hidden;
}
#gate {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  font-size: 14px;
  color: var(--text-dim);
  z-index: 100;
}
.app-shell {
  display: flex;
  height: 100vh;
}
/* ===== SIDEBAR ===== */
.rail {
  width: 220px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  flex-shrink: 0;
}
.rail-logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.03em;
  padding: 4px 10px 20px;
  background: linear-gradient(120deg, #fff 30%, var(--accent) 70%, var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.rail-section {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 14px 10px 6px;
}
.tab-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13.5px;
  font-weight: 500;
  border-radius: 9px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}
.tab-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.tab-btn.active {
  background: rgba(139,124,246,0.12);
  color: var(--accent);
}
.tab-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
/* ===== MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  height: 54px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--panel);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.save-status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim); }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.live-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar-right { display: flex; gap: 8px; }
.btn {
  padding: 7px 13px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 12.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn:hover { background: rgba(255,255,255,0.05); border-color: var(--border-hi); }
.btn svg { width: 14px; height: 14px; }
.content {
  flex: 1;
  display: flex;
  overflow: hidden;
}
/* ===== SETTINGS PANEL ===== */
.settings {
  width: 380px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
  flex-shrink: 0;
}
.settings h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--text);
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 11.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 500;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 9px 11px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent);
}
.field textarea { min-height: 80px; resize: vertical; }
.row { display: flex; gap: 10px; }
.row .field { flex: 1; }
/* ===== PREVIEW ===== */
.preview-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #07070c;
  position: relative;
  overflow: hidden;
}
.phone-frame {
  width: 340px;
  height: 680px;
  border-radius: 28px;
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
  background: #0a0a10;
}
#preview-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #0a0a10;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }
@media (max-width: 1000px) {
  .settings { width: 320px; }
  .phone-frame { transform: scale(0.85); }
}
</style>
</head>
<body>
<div id="gate">loading your profile…</div>

<div class="app-shell" id="shell" style="display:none;">
  <!-- SIDEBAR -->
  <div class="rail">
    <div class="rail-logo">Vex</div>

    <div class="rail-section">Profile</div>
    <button class="tab-btn active" data-tab="identity">Identity</button>
    <button class="tab-btn" data-tab="appearance">Appearance</button>
    <button class="tab-btn" data-tab="effects">Effects</button>
    <button class="tab-btn" data-tab="widgets">Widgets</button>
    <button class="tab-btn" data-tab="links">Links</button>
    <button class="tab-btn" data-tab="audio">Audio</button>
    <button class="tab-btn" data-tab="seo">SEO</button>

    <div class="rail-section" style="margin-top:20px;">Account</div>
    <button class="tab-btn" id="logout-btn" style="color:var(--danger);">Log out</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="save-status">
          <span class="save-dot" id="save-dot"></span>
          <span id="save-label">saved</span>
        </div>
        <a class="live-link" id="live-link" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="topbar-right">
        <button class="btn" id="perf-btn">Performance: OFF</button>
        <button class="btn" id="fullscreen-btn">Full preview</button>
      </div>
    </div>

    <div class="content">
      <!-- SETTINGS -->
      <div class="settings" id="settings">
        <!-- IDENTITY -->
        <div class="tab-panel active" data-panel="identity">
          <h3>Identity</h3>
          <div class="field">
            <label>Display name</label>
            <input type="text" data-path="identity.display" placeholder="Your name">
          </div>
          <div class="field">
            <label>Bio</label>
            <textarea data-path="identity.bio" placeholder="A short bio..."></textarea>
          </div>
          <div class="field">
            <label>Taglines (one per line)</label>
            <textarea id="taglines-input" placeholder="welcome.&#10;building things."></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label>Location</label>
              <input type="text" data-path="identity.location" placeholder="City">
            </div>
            <div class="field">
              <label>Joined text</label>
              <input type="text" data-path="identity.joined" placeholder="est. 2026">
            </div>
          </div>
          <div class="field">
            <label>Avatar text (fallback)</label>
            <input type="text" data-path="identity.avatarText" maxlength="2">
          </div>
        </div>

        <!-- APPEARANCE -->
        <div class="tab-panel" data-panel="appearance">
          <h3>Appearance</h3>
          <div class="row">
            <div class="field">
              <label>Accent 1</label>
              <input type="color" data-path="theme.accent1">
            </div>
            <div class="field">
              <label>Accent 2</label>
              <input type="color" data-path="theme.accent2">
            </div>
          </div>
          <div class="field">
            <label>Font</label>
            <select data-path="theme.font">
              <option value="space-grotesk">Space Grotesk</option>
              <option value="serif-elegant">Serif Elegant</option>
              <option value="mono-brutalist">Mono Brutalist</option>
              <option value="classic-sans">Sora Clean</option>
              <option value="poster-bold">Bebas Poster</option>
              <option value="cyber">Chakra Cyber</option>
            </select>
          </div>
          <div class="field">
            <label>Layout</label>
            <select data-path="theme.layout">
              <option value="default">Default</option>
              <option value="stacked">Stacked</option>
              <option value="compact">Compact</option>
              <option value="minimal">Minimal</option>
              <option value="terminal">Terminal</option>
            </select>
          </div>
          <div class="field">
            <label>Card width</label>
            <input type="range" data-path="theme.cardWidth" min="340" max="520" step="10">
          </div>
          <div class="field">
            <label>Glass / Opacity</label>
            <input type="range" data-path="theme.glass" min="20" max="90">
          </div>
          <div class="field">
            <label>Glow strength</label>
            <input type="range" data-path="theme.glow" min="0" max="100">
          </div>
        </div>

        <!-- EFFECTS -->
        <div class="tab-panel" data-panel="effects">
          <h3>Effects</h3>
          <div class="field">
            <label>Background style</label>
            <select data-path="background.style">
              <option value="particles">Particles</option>
              <option value="grid">Grid</option>
              <option value="plasma">Plasma</option>
              <option value="aurora">Aurora</option>
              <option value="snow">Snow</option>
              <option value="rain">Rain</option>
              <option value="fireflies">Fireflies</option>
              <option value="dither">Dither</option>
              <option value="none">None / Flat</option>
            </select>
          </div>
          <div class="field">
            <label>Username effect</label>
            <select data-path="theme.usernameEffect">
              <option value="none">None</option>
              <option value="gradient">Gradient</option>
              <option value="glow">Glow</option>
              <option value="rainbow">Rainbow</option>
              <option value="shake">Shake</option>
            </select>
          </div>
          <div class="field">
            <label><input type="checkbox" data-path="effects.entrance"> Entrance screen</label>
          </div>
          <div class="field">
            <label><input type="checkbox" data-path="effects.cursor"> Custom cursor</label>
          </div>
        </div>

        <!-- WIDGETS -->
        <div class="tab-panel" data-panel="widgets">
          <h3>Widgets</h3>
          <div class="field">
            <label><input type="checkbox" data-path="widgets.viewCounter"> View counter</label>
          </div>
          <div class="field">
            <label><input type="checkbox" data-path="widgets.discord.enabled"> Discord widget</label>
          </div>
          <div class="field">
            <label>Discord username</label>
            <input type="text" data-path="widgets.discord.username">
          </div>
          <div class="field">
            <label>Discord invite URL</label>
            <input type="text" data-path="widgets.discord.inviteUrl" placeholder="https://discord.gg/...">
          </div>
          <div class="field">
            <label><input type="checkbox" data-path="widgets.countdown.enabled"> Countdown</label>
          </div>
          <div class="field">
            <label>Countdown target (ISO date)</label>
            <input type="text" data-path="widgets.countdown.target" placeholder="2026-12-31T23:59:59">
          </div>
        </div>

        <!-- LINKS -->
        <div class="tab-panel" data-panel="links">
          <h3>Social Links</h3>
          <div id="socials-list"></div>
          <button class="btn" id="add-social" style="margin-top:10px;width:100%;justify-content:center;">+ Add link</button>
        </div>

        <!-- AUDIO -->
        <div class="tab-panel" data-panel="audio">
          <h3>Audio</h3>
          <div class="field">
            <label><input type="checkbox" data-path="audio.enabled"> Enable music player</label>
          </div>
          <div class="field">
            <label><input type="checkbox" data-path="audio.autoplay"> Autoplay</label>
          </div>
          <div class="field">
            <label>Volume</label>
            <input type="range" data-path="audio.volume" min="0" max="100">
          </div>
        </div>

        <!-- SEO -->
        <div class="tab-panel" data-panel="seo">
          <h3>SEO & Meta</h3>
          <div class="field">
            <label>Page title</label>
            <input type="text" data-path="meta.title">
          </div>
          <div class="field">
            <label>Description</label>
            <textarea data-path="meta.description"></textarea>
          </div>
        </div>
      </div>

      <!-- PREVIEW -->
      <div class="preview-area">
        <div class="phone-frame">
          <iframe id="preview-iframe" title="Live preview"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/render-client.js"></script>
<script>
let cfg = null;
let myHandle = '';
let saveTimer = null;
let previewTimer = null;
let lastPreview = 0;
let performanceMode = localStorage.getItem('vex-perf') === '1';

function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
}
function setPath(obj, path, val) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (!o[keys[i]]) o[keys[i]] = {};
    o = o[keys[i]];
  }
  o[keys[keys.length - 1]] = val;
}

async function init() {
  try {
    const meRes = await fetch('/api/me');
    if (!meRes.ok) {
      location.href = '/login';
      return;
    }
    const me = await meRes.json();
    myHandle = me.handle;

    const profileRes = await fetch('/api/profile');
    const data = await profileRes.json();
    cfg = data.config;

    document.getElementById('gate').style.display = 'none';
    document.getElementById('shell').style.display = 'flex';

    const origin = location.origin;
    document.getElementById('live-link').href = `${origin}/u/${myHandle}`;
    document.getElementById('live-link').textContent = `${origin}/u/${myHandle}`;

    bindInputs();
    renderSocials();
    updatePreview(true);
    setPerformanceMode(performanceMode);
  } catch (e) {
    console.error(e);
    document.getElementById('gate').textContent = 'Failed to load profile';
  }
}

function bindInputs() {
  document.querySelectorAll('[data-path]').forEach(el => {
    const path = el.dataset.path;
    const val = getPath(cfg, path);

    if (el.type === 'checkbox') {
      el.checked = !!val;
      el.addEventListener('change', () => {
        setPath(cfg, path, el.checked);
        scheduleUpdate();
      });
    } else if (el.type === 'color' || el.type === 'range' || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      if (val !== undefined && val !== null) el.value = val;
      el.addEventListener('input', () => {
        let v = el.value;
        if (el.type === 'range') v = Number(v);
        setPath(cfg, path, v);
        scheduleUpdate();
      });
    }
  });

  // Taglines special
  const tagInput = document.getElementById('taglines-input');
  if (tagInput && cfg.identity.taglines) {
    tagInput.value = cfg.identity.taglines.join('\n');
    tagInput.addEventListener('input', () => {
      cfg.identity.taglines = tagInput.value.split('\n').map(s => s.trim()).filter(Boolean);
      scheduleUpdate();
    });
  }
}

function scheduleUpdate() {
  scheduleSave();
  clearTimeout(previewTimer);
  const delay = performanceMode ? 420 : 260;
  previewTimer = setTimeout(() => updatePreview(false), delay);
}

function scheduleSave() {
  clearTimeout(saveTimer);
  document.getElementById('save-label').textContent = 'saving…';
  document.getElementById('save-dot').style.background = 'var(--accent2)';
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cfg)
      });
      if (!res.ok) throw new Error();
      document.getElementById('save-label').textContent = 'saved';
      document.getElementById('save-dot').style.background = 'var(--ok)';
    } catch (e) {
      document.getElementById('save-label').textContent = 'save failed';
      document.getElementById('save-dot').style.background = 'var(--danger)';
    }
  }, 600);
}

function updatePreview(force = false) {
  const now = Date.now();
  if (!force && now - lastPreview < (performanceMode ? 380 : 200)) return;
  lastPreview = now;

  const iframe = document.getElementById('preview-iframe');
  if (!iframe || !window.buildPublicHTML) return;

  try {
    const html = window.buildPublicHTML(cfg, { views: 0 });
    iframe.srcdoc = html;
  } catch (e) {
    console.warn('Preview error', e);
  }
}

function setPerformanceMode(on) {
  performanceMode = on;
  localStorage.setItem('vex-perf', on ? '1' : '0');
  const btn = document.getElementById('perf-btn');
  if (btn) btn.textContent = on ? 'Performance: ON' : 'Performance: OFF';
}

document.getElementById('perf-btn').addEventListener('click', () => {
  setPerformanceMode(!performanceMode);
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/login';
});

// Tabs
document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const panel = document.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`);
    if (panel) panel.classList.add('active');
  });
});

function renderSocials() {
  const list = document.getElementById('socials-list');
  if (!list || !cfg.socials) return;
  list.innerHTML = cfg.socials.map((s, i) => `
    <div class="field" style="display:flex;gap:8px;align-items:center;">
      <input type="text" value="${s.platform || ''}" placeholder="platform" data-social-i="${i}" data-social-key="platform" style="width:90px;">
      <input type="text" value="${s.url || ''}" placeholder="https://..." data-social-i="${i}" data-social-key="url" style="flex:1;">
      <button class="btn" onclick="removeSocial(${i})" style="padding:6px 9px;">×</button>
    </div>
  `).join('');

  list.querySelectorAll('[data-social-i]').forEach(el => {
    el.addEventListener('input', () => {
      const i = Number(el.dataset.socialI);
      const key = el.dataset.socialKey;
      if (!cfg.socials[i]) cfg.socials[i] = {};
      cfg.socials[i][key] = el.value;
      scheduleUpdate();
    });
  });
}

window.removeSocial = function(i) {
  cfg.socials.splice(i, 1);
  renderSocials();
  scheduleUpdate();
};

document.getElementById('add-social').addEventListener('click', () => {
  if (!cfg.socials) cfg.socials = [];
  cfg.socials.push({ platform: 'website', url: '', label: '' });
  renderSocials();
  scheduleUpdate();
});

init();
</script>
</body>
</html>
