<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --e-bg:#0b0c11; --e-panel:#111219; --e-panel-2:#15161f;
    --e-border:rgba(255,255,255,0.08); --e-border-hi:rgba(255,255,255,0.16);
    --e-text:#eceef5; --e-dim:#8a8ea3; --e-faint:#565a70;
    --e-accent:#8b7cf6; --e-accent2:#f6a56b; --e-ok:#7fd8a6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--e-bg); color:var(--e-text); font-family:'Manrope',sans-serif; overflow:hidden; }
  ::selection{ background:var(--e-accent); color:#0a0a10; }
  input,select,textarea,button{ font-family:inherit; }
  .app-shell{ display:flex; height:100vh; width:100vw; }

  .rail{ width:74px; flex-shrink:0; background:var(--e-panel); border-right:1px solid var(--e-border); display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:2px; overflow-y:auto; }
  .rail::-webkit-scrollbar{ width:0; }
  .rail-logo{ width:34px; height:34px; border-radius:9px; margin-bottom:10px; background:linear-gradient(135deg,var(--e-accent),var(--e-accent2)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#0a0a10; flex-shrink:0; }
  .tab-btn{ width:58px; padding:9px 0 7px; border:none; background:transparent; color:var(--e-faint); border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9px; letter-spacing:.02em; transition:background .2s ease, color .2s ease; flex-shrink:0; }
  .tab-btn svg{ width:17px; height:17px; }
  .tab-btn:hover{ background:rgba(255,255,255,0.04); color:var(--e-text); }
  .tab-btn.active{ background:rgba(139,124,246,0.14); color:var(--e-accent); }

  .settings{ width:380px; flex-shrink:0; background:var(--e-panel-2); border-right:1px solid var(--e-border); display:flex; flex-direction:column; height:100%; }
  .settings-header{ padding:18px 22px 12px; border-bottom:1px solid var(--e-border); }
  .settings-header h1{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; }
  .settings-header p{ font-size:11px; color:var(--e-faint); margin-top:2px; }
  .settings-body{ flex:1; overflow-y:auto; padding:18px 22px 40px; }
  .settings-body::-webkit-scrollbar{ width:6px; }
  .settings-body::-webkit-scrollbar-thumb{ background:var(--e-border-hi); border-radius:3px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--e-dim); margin-bottom:6px; font-family:'JetBrains Mono',monospace; }
  .field input[type=text], .field input[type=url], .field input[type=number], .field input[type=datetime-local], .field textarea, .field select{
    width:100%; background:var(--e-panel); border:1px solid var(--e-border); color:var(--e-text); padding:9px 11px; border-radius:9px; font-size:12.5px; outline:none; transition:border-color .2s ease; }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--e-accent); }
  .field textarea{ resize:vertical; min-height:60px; line-height:1.5; }
  .hint{ font-size:10px; color:var(--e-faint); margin-top:4px; }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; }
  .upload-row{ display:flex; gap:8px; }
  .upload-row input[type=text]{ flex:1; }
  .upload-btn{ flex-shrink:0; padding:0 12px; border-radius:9px; border:1px solid var(--e-border); background:var(--e-panel); color:var(--e-dim); font-size:11.5px; cursor:pointer; }
  .upload-btn:hover{ border-color:var(--e-accent); color:var(--e-text); }

  .color-field{ display:flex; align-items:center; gap:8px; }
  .color-field input[type=color]{ width:36px; height:36px; border-radius:9px; border:1px solid var(--e-border); background:none; cursor:pointer; padding:2px; }
  .color-field input[type=text]{ flex:1; font-family:'JetBrains Mono',monospace; font-size:11.5px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--e-border); }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle-row span{ font-size:12.5px; }
  .switch{ position:relative; width:36px; height:21px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:rgba(255,255,255,0.1); border-radius:99px; cursor:pointer; transition:background .2s ease; }
  .slider::before{ content:''; position:absolute; width:15px; height:15px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s ease; }
  .switch input:checked + .slider{ background:var(--e-accent); }
  .switch input:checked + .slider::before{ transform:translateX(15px); }

  .segmented{ display:flex; flex-wrap:wrap; background:var(--e-panel); border:1px solid var(--e-border); border-radius:9px; padding:3px; gap:3px; }
  .segmented button{ flex:1; min-width:70px; padding:7px 4px; border:none; background:transparent; color:var(--e-dim); border-radius:7px; font-size:10.5px; cursor:pointer; transition:background .2s ease,color .2s ease; }
  .segmented button.active{ background:var(--e-accent); color:#0a0a10; font-weight:600; }

  .range-field{ display:flex; align-items:center; gap:10px; }
  .range-field input[type=range]{ flex:1; accent-color:var(--e-accent); }
  .range-field .range-val{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--e-dim); width:32px; text-align:right; }

  .section-title{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--e-accent2); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ padding:7px 11px; border-radius:99px; border:1px solid var(--e-border); background:var(--e-panel); color:var(--e-dim); font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:border-color .2s ease,color .2s ease,background .2s ease; }
  .chip.active{ border-color:var(--e-accent); color:var(--e-text); background:rgba(139,124,246,0.14); }

  .list-row{ display:flex; align-items:center; gap:7px; margin-bottom:8px; background:var(--e-panel); border:1px solid var(--e-border); border-radius:9px; padding:8px; }
  .list-row select{ width:104px; flex-shrink:0; padding:8px; font-size:11.5px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:7px; color:var(--e-text); }
  .list-row input{ flex:1; min-width:0; padding:8px 9px; font-size:11.5px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:7px; color:var(--e-text); outline:none; }
  .list-row-stack{ display:flex; flex-direction:column; gap:6px; background:var(--e-panel); border:1px solid var(--e-border); border-radius:9px; padding:9px; margin-bottom:8px; }
  .list-row-stack .lr-top{ display:flex; gap:6px; }
  .list-row-stack input{ flex:1; min-width:0; padding:8px 9px; font-size:11.5px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:7px; color:var(--e-text); outline:none; }
  .icon-btn{ width:28px; height:28px; flex-shrink:0; border-radius:7px; border:1px solid var(--e-border); background:var(--e-panel-2); color:var(--e-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:hover{ color:#ff8484; border-color:#ff8484; }
  .icon-btn svg{ width:13px; height:13px; }
  .add-btn{ width:100%; padding:9px; border:1px dashed var(--e-border-hi); background:transparent; color:var(--e-dim); border-radius:9px; cursor:pointer; font-size:12px; margin-top:2px; transition:border-color .2s ease,color .2s ease; }
  .add-btn:hover{ border-color:var(--e-accent); color:var(--e-accent); }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{ height:54px; flex-shrink:0; border-bottom:1px solid var(--e-border); display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--e-panel); gap:12px; }
  .topbar-left{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--e-dim); min-width:0; }
  .save-dot{ width:7px; height:7px; border-radius:50%; background:var(--e-ok); transition:background .3s ease; flex-shrink:0; }
  .live-link{ display:flex; align-items:center; gap:7px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:8px; padding:6px 10px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--e-text); text-decoration:none; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:260px; }
  .live-link:hover{ border-color:var(--e-accent); }
  .topbar-right{ display:flex; gap:8px; }
  .btn{ padding:8px 14px; border-radius:8px; font-size:12px; border:1px solid var(--e-border-hi); background:transparent; color:var(--e-text); cursor:pointer; display:flex; align-items:center; gap:6px; transition:border-color .2s ease; }
  .btn:hover{ border-color:var(--e-accent); }
  .btn.primary{ background:linear-gradient(135deg,var(--e-accent),var(--e-accent2)); color:#0a0a10; border:none; font-weight:600; }
  .btn svg{ width:13px; height:13px; }

  .preview-wrap{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 20%, rgba(139,124,246,0.06), transparent 55%), repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 22px);
    padding:26px; }
  .phone-frame{ width:390px; height:780px; border-radius:38px; padding:12px; background:#050505; box-shadow:0 40px 100px -30px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05); position:relative; flex-shrink:0; }
  .phone-frame::before{ content:''; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:110px; height:22px; background:#050505; border-radius:0 0 16px 16px; z-index:2; }
  .phone-frame iframe{ width:100%; height:100%; border:none; border-radius:28px; background:#0a0a10; }

  .fullscreen-frame{ display:none; position:fixed; inset:0; z-index:100; background:#0a0a10; }
  .fullscreen-frame.show{ display:block; }
  .fullscreen-frame iframe{ width:100%; height:100%; border:none; }
  .exit-fs{ position:fixed; top:16px; right:16px; z-index:101; padding:9px 16px; border-radius:8px; background:rgba(20,20,28,0.85); border:1px solid var(--e-border-hi); color:#fff; font-size:12px; cursor:pointer; backdrop-filter:blur(8px); }

  #gate{ position:fixed; inset:0; z-index:200; background:var(--e-bg); display:flex; align-items:center; justify-content:center; color:var(--e-dim); font-size:13px; }

  @media (max-width: 900px){ .settings{ width:310px; } .phone-frame{ transform:scale(0.82); } .live-link{ max-width:140px; } }
</style>
</head>
<body>
<div id="gate">loading your profile…</div>
<div class="app-shell" id="shell" style="display:none;">

  <div class="rail">
    <div class="rail-logo">V</div>
    <button class="tab-btn active" data-tab="identity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Identity</button>
    <button class="tab-btn" data-tab="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18 4 4 0 010-8 3 3 0 003-3 3 3 0 00-3-3z"/></svg>Theme</button>
    <button class="tab-btn" data-tab="background"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 16l5-6 4 5 3-4 6 5"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>Backdrop</button>
    <button class="tab-btn" data-tab="effects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>Effects</button>
    <button class="tab-btn" data-tab="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Audio</button>
    <button class="tab-btn" data-tab="widgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Widgets</button>
    <button class="tab-btn" data-tab="socials"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6"/></svg>Socials</button>
    <button class="tab-btn" data-tab="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16M4 12h16M4 19h10"/></svg>SEO</button>
    <button class="tab-btn" id="logout-btn" style="margin-top:auto;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Log out
    </button>
  </div>

  <div class="settings">
    <div class="settings-header"><h1>Profile Builder</h1><p>Live at your own link — edit anything.</p></div>
    <div class="settings-body" id="settings-body"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="save-dot" id="save-dot"></span><span id="save-label">saved</span>
        <a class="live-link" id="live-link" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="topbar-right">
        <button class="btn" id="fullscreen-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>Full preview</button>
        <button class="btn" id="download-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>Export HTML</button>
      </div>
    </div>
    <div class="preview-wrap"><div class="phone-frame"><iframe id="preview-iframe" title="live preview"></iframe></div></div>
  </div>
</div>

<div class="fullscreen-frame" id="fullscreen-frame">
  <button class="exit-fs" id="exit-fs">✕ exit preview</button>
  <iframe id="fullscreen-iframe" title="full preview"></iframe>
</div>

<script src="/render-client.js"></script>
<script>
/* ============================================================ SHARED CONSTS (also in /render-client.js) ============================================================ */
const PLATFORMS = ['twitter','github','discord','instagram','youtube','tiktok','spotify','twitch','telegram','website','email','kick','reddit','steam','roblox','snapchat','linkedin','soundcloud','bluesky','threads','facebook','pinterest','paypal','xbox','psn','minecraft'];
const BADGES = {
  verified:{ glyph:'✓', color:'#8b7cf6', name:'Verified' }, premium:{ glyph:'♦', color:'#f6c343', name:'Premium' },
  staff:{ glyph:'⚑', color:'#f65b5b', name:'Staff' }, legend:{ glyph:'★', color:'#f6a56b', name:'Legend' },
  shield:{ glyph:'⛨', color:'#7fb8f6', name:'Shield' }, heart:{ glyph:'♥', color:'#f68fb0', name:'Heart' },
  crown:{ glyph:'♛', color:'#f6d55c', name:'Crown' }, gift:{ glyph:'🎁', color:'#7fd8a6', name:'Gift' },
  trophy:{ glyph:'🏆', color:'#f6a56b', name:'Trophy' }, booster:{ glyph:'⚡', color:'#c78bf6', name:'Booster' },
  bug:{ glyph:'🐞', color:'#f65b5b', name:'Bug hunter' }, og:{ glyph:'⬥', color:'#8a8ea3', name:'OG' }
};
const FONT_PRESETS = {
  'space-grotesk': { name:'Grotesk / Mono' }, 'serif-elegant': { name:'Serif / Elegant' }, 'mono-brutalist': { name:'All Mono / Brutalist' },
  'classic-sans': { name:'Sora / Clean' }, 'poster-bold': { name:'Bebas / Poster' }, 'cyber': { name:'Chakra / Cyber' }
};

let cfg = null;
let myHandle = '';
let saveTimer = null, previewTimer = null;

function deepMerge(base, extra){
  const out = JSON.parse(JSON.stringify(base));
  if(!extra) return out;
  for(const k in extra){
    if(extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && out[k] && typeof out[k]==='object' && !Array.isArray(out[k])){
      out[k] = deepMerge(out[k], extra[k]);
    } else { out[k] = extra[k]; }
  }
  return out;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o?.[k], obj); }
function setPath(obj, path, val){ const keys=path.split('.'); let o=obj; for(let i=0;i<keys.length-1;i++) o=o[keys[i]]; o[keys[keys.length-1]]=val; }

/* ============================================================ AUTH + LOAD ============================================================ */
async function init(){
  const meRes = await fetch('/api/me');
  if(!meRes.ok){ location.href = '/login'; return; }
  const me = await meRes.json();
  myHandle = me.handle;

  const profileRes = await fetch('/api/profile');
  const data = await profileRes.json();
  cfg = data.config;

  document.getElementById('gate').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  const liveLink = document.getElementById('live-link');
  liveLink.href = '/u/' + myHandle;
  liveLink.textContent = location.origin.replace(/^https?:\/\//,'') + '/u/' + myHandle;

  renderTab(currentTab);
  updatePreview();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  document.getElementById('save-label').textContent='saving…';
  document.getElementById('save-dot').style.background='var(--e-accent2)';
  saveTimer = setTimeout(async ()=>{
    try{
      const res = await fetch('/api/profile', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cfg) });
      if(!res.ok) throw new Error();
      document.getElementById('save-label').textContent='saved';
      document.getElementById('save-dot').style.background='var(--e-ok)';
    }catch(e){
      document.getElementById('save-label').textContent='save failed';
      document.getElementById('save-dot').style.background='#ff8484';
    }
  }, 500);
}
function scheduleUpdate(){ scheduleSave(); clearTimeout(previewTimer); previewTimer=setTimeout(updatePreview, 220); }

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await fetch('/api/auth/logout', { method:'POST' });
  location.href = '/login';
});

/* ============================================================ TABS ============================================================ */
let currentTab='identity';
document.querySelectorAll('.tab-btn[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn[data-tab]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentTab=btn.dataset.tab; renderTab(currentTab);
  });
});

function field(label, inner, hint){ return `<div class="field"><label>${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`; }
function textInput(path, placeholder=''){ return `<input type="text" data-path="${path}" placeholder="${placeholder}">`; }
function textarea(path, placeholder=''){ return `<textarea data-path="${path}" placeholder="${placeholder}"></textarea>`; }
function colorInput(path){ return `<div class="color-field"><input type="color" data-path="${path}" data-kind="color"><input type="text" data-path="${path}" data-kind="colortext"></div>`; }
function toggleRow(label, path){ return `<div class="toggle-row"><span>${label}</span><label class="switch"><input type="checkbox" data-path="${path}" data-kind="checkbox"><span class="slider"></span></label></div>`; }
function rangeField(path, min, max, step){ return `<div class="range-field"><input type="range" data-path="${path}" min="${min}" max="${max}" step="${step}"><span class="range-val" data-valfor="${path}"></span></div>`; }
function segmented(path, options){ return `<div class="segmented" data-seg="${path}">${options.map(o=>`<button data-val="${o.v}">${o.l}</button>`).join('')}</div>`; }
function dtInput(path){ return `<input type="datetime-local" data-path="${path}">`; }
function uploadField(label, path, hint){
  return `<div class="field"><label>${label}</label><div class="upload-row">
    <input type="text" data-path="${path}" placeholder="https://...">
    <button type="button" class="upload-btn" data-upload-for="${path}">Upload</button>
    <input type="file" accept="image/*" style="display:none" data-file-for="${path}">
  </div>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}

function renderTab(tab){
  const body = document.getElementById('settings-body');
  let html='';

  if(tab==='identity'){
    html+=`<div class="section-title">Basics</div>`;
    html+=field('Display name', textInput('identity.display'));
    html+=field('Handle', `<input type="text" value="@${myHandle}" disabled style="opacity:.6;">`, 'your handle is set at signup and can\'t be changed here');
    html+=field('Avatar letter', textInput('identity.avatarText'));
    html+=uploadField('Avatar image', 'identity.avatarImg', 'upload a file or paste a URL — leave blank for the letter avatar');
    html+=uploadField('Banner image', 'identity.bannerImg', 'leave blank for a gradient banner');
    html+=`<div class="section-title">Bio</div>`;
    html+=field('Bio text', textarea('identity.bio'));
    html+=field('Rotating taglines', textarea('identity.taglines'), 'one line each — typed out on loop');
    html+=`<div class="section-title">Extra fields</div>`;
    html+=toggleRow('Show location', 'identity.locationShow');
    html+=field('Location', textInput('identity.location','Inland Empire, CA'));
    html+=toggleRow('Show age', 'identity.ageShow');
    html+=field('Age', textInput('identity.age','19'));
    html+=toggleRow('Show join date', 'identity.joinedShow');
    html+=field('Join date text', textInput('identity.joined','est. 2026'));
  }

  if(tab==='theme'){

    html+=`<div class="section-title">Layout</div>`;
    html+=field('Preset', segmented('theme.layout', [
      {v:'default',l:'Default'},{v:'stacked',l:'Stacked'},{v:'compact',l:'Compact'},{v:'minimal',l:'Minimal'},{v:'terminal',l:'Terminal'}
    ]));
    html+=field('Card width', rangeField('theme.cardWidth',340,520,4));
    html+=field('Avatar shape', segmented('theme.avatarShape', [{v:'circle',l:'Circle'},{v:'rounded',l:'Rounded square'}]));
    html+=field('Corner radius', rangeField('theme.radius',0,36,1));
    html+=field('Glass opacity', rangeField('theme.glass',10,90,1));
    html+=field('Border style', segmented('theme.borderStyle', [{v:'solid',l:'Solid'},{v:'glow',l:'Glow'},{v:'none',l:'None'}]));
    html+=toggleRow('Card gradient wash', 'theme.cardGradient');
  }

  if(tab==='background'){
    html+=`<div class="section-title">Style</div>`;
    html+=field('Background type', segmented('background.style', [
      {v:'particles',l:'Particles'},{v:'grid',l:'Grid'},{v:'plasma',l:'Plasma'},{v:'aurora',l:'Aurora'},
      {v:'snow',l:'Snow'},{v:'rain',l:'Rain'},{v:'fireflies',l:'Fireflies'},{v:'dither',l:'Dither'},
      {v:'image',l:'Image'},{v:'video',l:'Video'},{v:'none',l:'None'}
    ]));
    html+=field('Image / video URL', textInput('background.mediaUrl','https://...'), 'used when type is Image or Video');
    html+=field('Blur', rangeField('background.blur',0,20,1));
    html+=field('Dim overlay', rangeField('background.dim',0,80,1));
  }

  if(tab==='effects'){
    html+=`<div class="section-title">Cursor</div>`;
    html+=toggleRow('Custom cursor', 'effects.cursor');
    html+=field('Cursor style', segmented('effects.cursorStyle', [{v:'ring',l:'Dot + ring'},{v:'trail',l:'Particle trail'}]));
    html+=`<div class="section-title">Entrance</div>`;
    html+=toggleRow('Entrance screen', 'effects.entrance');
    html+=field('Entrance title', textInput('effects.entranceTitle'));
    html+=field('Entrance subtitle', textInput('effects.entranceSub'));
    html+=`<div class="section-title">Particle behavior</div>`;
    html+=field('Cursor reaction', segmented('effects.reaction', [{v:'repel',l:'Repel'},{v:'attract',l:'Attract'},{v:'none',l:'Static'}]));
    html+=`<div class="hint">Motion automatically respects visitors' "reduce motion" OS setting.</div>`;
  }

  if(tab==='audio'){
    html+=`<div class="section-title">Player</div>`;
    html+=toggleRow('Show audio player', 'audio.enabled');
    html+=toggleRow('Autoplay on entrance', 'audio.autoplay');
    html+=field('Default volume', rangeField('audio.volume',0,100,1));
    html+=`<div class="section-title">Tracks</div>`;
    html+=`<div id="tracks-list"></div>`;
    html+=`<button class="add-btn" id="add-track">+ add track</button>`;
    html+=`<div class="hint">Paste a direct .mp3 URL. Leave URL blank to show the track without playback.</div>`;
  }

  if(tab==='widgets'){
    html+=`<div class="section-title">Status</div>`;
    html+=toggleRow('View counter', 'widgets.viewCounter');
    html+=toggleRow('Live clock', 'widgets.clock');
    html+=`<div class="section-title">Badges</div>`;
    html+=`<div class="chip-grid" id="badge-grid"></div>`;
    html+=`<div class="section-title">Discord widget</div>`;
    html+=toggleRow('Show Discord widget', 'widgets.discord.enabled');
    html+=field('Username', textInput('widgets.discord.username'));
    html+=field('Status', segmented('widgets.discord.status', [{v:'online',l:'Online'},{v:'idle',l:'Idle'},{v:'dnd',l:'DND'},{v:'offline',l:'Offline'}]));
    html+=field('Activity text', textInput('widgets.discord.activity','Listening to Spotify'));
    html+=field('Server invite URL', textInput('widgets.discord.inviteUrl','https://discord.gg/...'));
    html+=`<div class="section-title">Countdown</div>`;
    html+=toggleRow('Show countdown', 'widgets.countdown.enabled');
    html+=field('Label', textInput('widgets.countdown.label'));
    html+=field('Target date/time', dtInput('widgets.countdown.target'));

  if(tab==='socials'){
    html+=`<div class="section-title">Links</div>`;

    html+=field('Page title', textInput('meta.title'), 'defaults to your display name');

    html+=field('Social preview image URL', textInput('meta.ogImage','https://...'));

  body.innerHTML = html;
  bindFields();
  if(tab==='socials') renderSocialsList();

function bindFields(){
  document.querySelectorAll('#settings-body [data-path]').forEach(el=>{
    const path = el.dataset.path; const val = getPath(cfg, path);
    if(el.dataset.kind==='checkbox'){
      el.checked=!!val; el.addEventListener('change', ()=>{ setPath(cfg,path,el.checked); scheduleUpdate(); });
    } else if(el.dataset.kind==='color'){
      el.value=val; el.addEventListener('input', ()=>{ setPath(cfg,path,el.value); const t=document.querySelector(`[data-path="${path}"][data-kind="colortext"]`); if(t) t.value=el.value; scheduleUpdate(); });
    } else if(el.dataset.kind==='colortext'){
      el.value=val; el.addEventListener('input', ()=>{ setPath(cfg,path,el.value); const t=document.querySelector(`[data-path="${path}"][data-kind="color"]`); if(t) t.value=el.value; scheduleUpdate(); });
    } else if(el.tagName==='SELECT'){
      el.value=val; el.addEventListener('change', ()=>{ setPath(cfg,path,el.value); scheduleUpdate(); });
    } else if(el.tagName==='TEXTAREA'){
      el.value = Array.isArray(val) ? val.join('\n') : (val||'');
      el.addEventListener('input', ()=>{ setPath(cfg,path, el.value.split('\n').filter(Boolean)); scheduleUpdate(); });
    } else if(el.type==='range'){
      el.value=val; const label=document.querySelector(`[data-valfor="${path}"]`); if(label) label.textContent=val;
      el.addEventListener('input', ()=>{ setPath(cfg,path,Number(el.value)); if(label) label.textContent=el.value; scheduleUpdate(); });
    } else if(el.type==='datetime-local'){
      el.value = val || ''; el.addEventListener('input', ()=>{ setPath(cfg,path,el.value); scheduleUpdate(); });
    } else if(el.type==='file'){
      /* handled separately below */
    } else {
      el.value = val ?? ''; el.addEventListener('input', ()=>{ setPath(cfg,path,el.value); scheduleUpdate(); });
    }
  });

  document.querySelectorAll('[data-seg]').forEach(seg=>{
    const path = seg.dataset.seg; const val = getPath(cfg,path);
    seg.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('active', b.dataset.val===val);
      b.addEventListener('click', ()=>{
        setPath(cfg,path,b.dataset.val);
        seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active'); scheduleUpdate();
      });
    });
  });

  document.querySelectorAll('[data-upload-for]').forEach(btn=>{
    const path = btn.dataset.uploadFor;
    const fileInput = document.querySelector(`[data-file-for="${path}"]`);
    btn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', async ()=>{
      if(!fileInput.files[0]) return;
      const fd = new FormData(); fd.append('file', fileInput.files[0]);
      btn.textContent = '…';
      try{
        const res = await fetch('/api/upload', { method:'POST', body: fd });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'upload failed');
        setPath(cfg, path, data.url);
        const textEl = document.querySelector(`input[type=text][data-path="${path}"]`);
        if(textEl) textEl.value = data.url;
        scheduleUpdate();
      }catch(e){ alert(e.message); }
      btn.textContent = 'Upload';
    });
  });
}

function renderSocialsList(){
  const list = document.getElementById('socials-list');
  list.innerHTML = cfg.socials.map((s,i)=>`
    <div class="list-row">
      <select data-si="${i}" data-field="platform">${PLATFORMS.map(p=>`<option value="${p}" ${p===s.platform?'selected':''}>${p}</option>`).join('')}</select>
      <input type="text" data-si="${i}" data-field="url" value="${(s.url||'').replace(/"/g,'&quot;')}" placeholder="https://...">
      <button class="icon-btn" data-remove="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>`).join('');
  list.querySelectorAll('select,input').forEach(el=>{
    el.addEventListener('input', ()=>{ cfg.socials[Number(el.dataset.si)][el.dataset.field]=el.value; scheduleUpdate(); });
  });
  list.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ cfg.socials.splice(Number(btn.dataset.remove),1); renderSocialsList(); scheduleUpdate(); });
  });
}
document.getElementById('settings-body').addEventListener('click', e=>{
  if(e.target.id==='add-social'){ cfg.socials.push({platform:'website', url:'https://', label:''}); renderSocialsList(); scheduleUpdate(); }
  if(e.target.id==='add-track'){ cfg.audio.tracks.push({title:'New track', artist:'Unknown', url:''}); renderTracksList(); scheduleUpdate(); }
});

function renderTracksList(){
  const list = document.getElementById('tracks-list'); if(!list) return;
  list.innerHTML = cfg.audio.tracks.map((t,i)=>`
    <div class="list-row-stack">
      <div class="lr-top">
        <input type="text" data-ti="${i}" data-tf="title" value="${(t.title||'').replace(/"/g,'&quot;')}" placeholder="Title">
        <input type="text" data-ti="${i}" data-tf="artist" value="${(t.artist||'').replace(/"/g,'&quot;')}" placeholder="Artist">
        <button class="icon-btn" data-tremove="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <input type="text" data-ti="${i}" data-tf="url" value="${(t.url||'').replace(/"/g,'&quot;')}" placeholder="https://...mp3 (optional)">
    </div>`).join('');
  list.querySelectorAll('input').forEach(el=>{
    el.addEventListener('input', ()=>{ cfg.audio.tracks[Number(el.dataset.ti)][el.dataset.tf]=el.value; scheduleUpdate(); });
  });
  list.querySelectorAll('[data-tremove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ cfg.audio.tracks.splice(Number(btn.dataset.tremove),1); renderTracksList(); scheduleUpdate(); });
  });
}

function renderBadgeGrid(){
  const grid = document.getElementById('badge-grid'); if(!grid) return;
  grid.innerHTML = Object.entries(BADGES).map(([k,b])=>`
    <button class="chip ${cfg.widgets.badges.includes(k)?'active':''}" data-badge="${k}"><span style="color:${b.color}">${b.glyph}</span> ${b.name}</button>
  `).join('');
  grid.querySelectorAll('[data-badge]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const k = chip.dataset.badge;
      const idx = cfg.widgets.badges.indexOf(k);
      if(idx===-1) cfg.widgets.badges.push(k); else cfg.widgets.badges.splice(idx,1);
      renderBadgeGrid(); scheduleUpdate();
    });
  });
}

/* ============================================================ PREVIEW / EXPORT ============================================================ */
function updatePreview(){
  const html = window.buildPublicHTML(cfg, { views: 1284 });
  document.getElementById('preview-iframe').srcdoc = html;
  if(document.getElementById('fullscreen-frame').classList.contains('show')){
    document.getElementById('fullscreen-iframe').srcdoc = html;
  }
}
document.getElementById('fullscreen-btn').addEventListener('click', ()=>{
  document.getElementById('fullscreen-iframe').srcdoc = window.buildPublicHTML(cfg, { views: 1284 });
  document.getElementById('fullscreen-frame').classList.add('show');
});
document.getElementById('exit-fs').addEventListener('click', ()=>{ document.getElementById('fullscreen-frame').classList.remove('show'); });
document.getElementById('download-btn').addEventListener('click', ()=>{
  const html = window.buildPublicHTML(cfg, { views: 1284 });
  const blob = new Blob([html], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=(myHandle||'profile')+'.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
});

init();
