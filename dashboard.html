<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vex</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080d;
  --panel: #0f1018;
  --panel-2: #161722;
  --border: rgba(255,255,255,0.06);
  --border-hi: rgba(255,255,255,0.12);
  --text: #eceef5;
  --text-dim: #8b8fa3;
  --text-faint: #4a4d5e;
  --accent: #9f7aea;
  --accent2: #f6a56b;
  --ok: #6fd9a0;
  --danger: #f25b5b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  height: 100vh;
  overflow: hidden;
}
#gate {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  font-size: 13px;
  color: var(--text-dim);
  z-index: 100;
  letter-spacing: 0.04em;
}
.app-shell { display: flex; height: 100vh; }

/* SIDEBAR */
.rail {
  width: 200px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 14px 8px;
  flex-shrink: 0;
}
.rail-logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 18px;
  padding: 2px 10px 16px;
  background: linear-gradient(120deg, #fff 20%, var(--accent) 60%, var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.rail-section {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 12px 10px 4px;
}
.tab-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  border-radius: 7px;
  cursor: pointer;
  text-align: left;
  transition: all 0.12s;
}
.tab-btn:hover { background: rgba(255,255,255,0.03); color: var(--text); }
.tab-btn.active {
  background: linear-gradient(90deg, rgba(159,122,234,0.18), rgba(159,122,234,0.05));
  color: var(--accent);
  box-shadow: inset 2px 0 0 var(--accent);
}

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 48px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--panel);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.save-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.live-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar-right { display: flex; gap: 6px; }
.btn {
  padding: 6px 11px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.12s;
}
.btn:hover { background: #1c1d2a; border-color: var(--border-hi); }
.btn.accent {
  background: linear-gradient(135deg, rgba(159,122,234,0.2), rgba(246,165,107,0.1));
  border-color: rgba(159,122,234,0.35);
  color: var(--accent);
}
.platform-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:8px;
}
.platform-chip{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; padding:12px 6px; border-radius:12px;
  background:var(--panel-2); border:1px solid var(--border);
  cursor:pointer; transition:all .15s; user-select:none;
  min-height:72px;
}
.platform-chip:hover{
  border-color:rgba(159,122,234,0.45);
  background:rgba(159,122,234,0.08);
  transform:translateY(-1px);
}
.platform-chip.active{
  border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(159,122,234,0.25);
  background:rgba(159,122,234,0.12);
}
.platform-chip .p-icon{display:flex; align-items:center; justify-content:center; width:20px; height:20px; color:var(--text);}
.platform-chip .p-icon svg{width:100%; height:100%;}
.platform-chip .p-name{
  font-size:10px; color:var(--text-dim); text-align:center;
  letter-spacing:0.02em; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.platform-chip.active .p-name{ color:var(--accent); }
.social-active-row{
  display:flex; gap:8px; align-items:center;
  background:var(--panel-2); border:1px solid var(--border);
  border-radius:10px; padding:10px; margin-bottom:8px;
}
.social-active-row .sa-icon{
  width:36px; height:36px; border-radius:10px;
  background:rgba(159,122,234,0.12); display:flex; align-items:center; justify-content:center;
  color:var(--accent); flex-shrink:0;
}
.social-active-row .sa-icon svg{width:18px; height:18px;}
.social-active-row .sa-fields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.social-active-row input{
  width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:12px;
}
.social-active-row .sa-remove{
  background:none; border:none; color:var(--danger); cursor:pointer; font-size:18px; padding:4px 8px;
}

.content { flex: 1; display: flex; overflow: hidden; }

/* SETTINGS */
.settings {
  width: 400px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px 14px 40px;
  background: var(--bg);
  flex-shrink: 0;
}
.settings h3 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.field { margin-bottom: 11px; }
.field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  font-weight: 500;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 7px 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: rgba(159,122,234,0.5);
  box-shadow: 0 0 0 2px rgba(159,122,234,0.1);
}
.field textarea { min-height: 60px; resize: vertical; }
.row { display: flex; gap: 8px; }
.row .field { flex: 1; }
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
}
.check input { accent-color: var(--accent); width: 14px; height: 14px; }

.upload-row { display: flex; gap: 6px; }
.upload-row input { flex: 1; }

.card-block {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
}

/* PREVIEW */
.preview-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%, rgba(159,122,234,0.07), transparent 70%),
    #06060a;
  position: relative;
  overflow: hidden;
}
.phone-frame {
  width: 320px;
  height: 640px;
  border-radius: 26px;
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
  box-shadow:
    0 40px 100px -30px rgba(0,0,0,0.9),
    0 0 0 1px rgba(255,255,255,0.04),
    0 0 80px -20px rgba(159,122,234,0.25);
  background: #0a0a10;
  position: relative;
}
.phone-frame::before {
  content: '';
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 6px;
  background: #1a1a22;
  border-radius: 4px;
  z-index: 2;
}
#preview-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #0a0a10;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }
</style>
</head>
<body>
<div id="gate">loading profile…</div>

<div class="app-shell" id="shell" style="display:none;">
  <div class="rail">
    <div class="rail-logo">Vex</div>
    <div class="rail-section">Profile</div>
    <button class="tab-btn active" data-tab="identity">Identity</button>
    <button class="tab-btn" data-tab="appearance">Appearance</button>
    <button class="tab-btn" data-tab="effects">Effects</button>
    <button class="tab-btn" data-tab="widgets">Widgets</button>
    <button class="tab-btn" data-tab="links">Links</button>
    <button class="tab-btn" data-tab="audio">Audio</button>
    <button class="tab-btn" data-tab="seo">SEO</button>
    <div class="rail-section" style="margin-top:16px;">Account</div>
    <button class="tab-btn" id="logout-btn" style="color:var(--danger);">Log out</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="save-status">
          <span class="save-dot" id="save-dot"></span>
          <span id="save-label">saved</span>
        </div>
        <a class="live-link" id="live-link" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="topbar-right">
        <button class="btn" id="perf-btn">Perf: OFF</button>
        <button class="btn accent" onclick="window.open(document.getElementById('live-link').href)">Open live</button>
      </div>
    </div>

    <div class="content">
      <div class="settings">

        <!-- IDENTITY -->
        <div class="tab-panel active" data-panel="identity">
          <h3>Identity</h3>
          <div id="completion-box" style="background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <strong style="font-size:13px;">Profile completion</strong>
              <span id="completion-pct" style="font-size:12px;color:var(--accent);">0%</span>
            </div>
            <div style="height:6px;background:#0a0a10;border-radius:99px;overflow:hidden;margin-bottom:10px;">
              <div id="completion-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;"></div>
            </div>
            <ul id="completion-list" style="margin:0;padding-left:18px;font-size:12px;color:var(--text-dim);line-height:1.7;"></ul>
            <div id="click-stats" style="margin-top:10px;font-size:11px;color:var(--text-dim);"></div>
          </div>
          <div class="field"><label>Display name</label><input type="text" data-path="identity.display"></div>
          <div class="field"><label>Bio</label><textarea data-path="identity.bio"></textarea></div>
          <div class="field"><label>Taglines (one per line)</label><textarea id="taglines-input"></textarea></div>
          <div class="row">
            <div class="field"><label>Location</label><input type="text" data-path="identity.location"></div>
            <div class="field"><label>Joined</label><input type="text" data-path="identity.joined"></div>
          </div>
          <label class="check"><input type="checkbox" data-path="identity.locationShow"> Show location</label>
          <label class="check"><input type="checkbox" data-path="identity.joinedShow"> Show joined</label>

          <div class="field"><label>Avatar text</label><input type="text" data-path="identity.avatarText" maxlength="2"></div>
          <div class="field">
            <label>Avatar image</label>
            <div class="upload-row">
              <input type="text" data-path="identity.avatarImg" placeholder="URL or upload">
              <button class="btn" onclick="uploadImage('identity.avatarImg')">Upload</button>
            </div>
          </div>
          <div class="field">
            <label>Banner image</label>
            <div class="upload-row">
              <input type="text" data-path="identity.bannerImg" placeholder="URL or upload">
              <button class="btn" onclick="uploadImage('identity.bannerImg')">Upload</button>
            </div>
          </div>
        </div>

        <!-- APPEARANCE -->
        <div class="tab-panel" data-panel="appearance">
          <h3>Appearance</h3>
          <div class="row">
            <div class="field"><label>Accent 1</label><input type="color" data-path="theme.accent1"></div>
            <div class="field"><label>Accent 2</label><input type="color" data-path="theme.accent2"></div>
          </div>
          <div class="field">
            <label>Font</label>
            <select data-path="theme.font">
              <option value="space-grotesk">Space Grotesk</option>
              <option value="serif-elegant">Serif Elegant</option>
              <option value="mono-brutalist">Mono Brutalist</option>
              <option value="classic-sans">Sora Clean</option>
              <option value="poster-bold">Bebas Poster</option>
              <option value="cyber">Chakra Cyber</option>
            </select>
          </div>
          <div class="field">
            <label>Layout</label>
            <select data-path="theme.layout">
              <option value="default">Default</option>
              <option value="stacked">Stacked</option>
              <option value="compact">Compact</option>
              <option value="minimal">Minimal</option>
              <option value="terminal">Terminal</option>
            </select>
          </div>
          <div class="field">
            <label>Username effect</label>
            <select data-path="theme.usernameEffect">
              <option value="none">None</option>
              <option value="gradient">Gradient</option>
              <option value="glow">Glow</option>
              <option value="rainbow">Rainbow</option>
              <option value="shake">Shake</option>
            </select>
          </div>
          <div class="field">
            <label>Avatar shape</label>
            <select data-path="theme.avatarShape">
              <option value="circle">Circle</option>
              <option value="rounded">Rounded</option>
            </select>
          </div>
          <div class="field"><label>Card width</label><input type="range" data-path="theme.cardWidth" min="340" max="520" step="10"></div>
          <div class="field"><label>Border radius</label><input type="range" data-path="theme.radius" min="6" max="36"></div>
          <div class="field"><label>Glass opacity</label><input type="range" data-path="theme.glass" min="20" max="90"></div>
          <div class="field"><label>Card blur</label><input type="range" data-path="theme.cardBlur" min="0" max="40"></div>
          <div class="field"><label>Glow strength</label><input type="range" data-path="theme.glow" min="0" max="100"></div>
          <label class="check"><input type="checkbox" data-path="theme.cardGradient"> Card gradient</label>
          <label class="check"><input type="checkbox" data-path="theme.glowSocials"> Glow on socials</label>
          <label class="check"><input type="checkbox" data-path="theme.glowBadges"> Glow on badges</label>
        </div>

        <!-- EFFECTS -->
        <div class="tab-panel" data-panel="effects">
          <h3>Effects</h3>
          <div class="field">
            <label>Background</label>
            <select data-path="background.style">
              <option value="particles">Particles</option>
              <option value="grid">Grid</option>
              <option value="plasma">Plasma</option>
              <option value="aurora">Aurora</option>
              <option value="snow">Snow</option>
              <option value="rain">Rain</option>
              <option value="fireflies">Fireflies</option>
              <option value="dither">Dither</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="field">
            <label>Particle reaction</label>
            <select data-path="effects.reaction">
              <option value="repel">Repel</option>
              <option value="attract">Attract</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="field"><label>Background dim</label><input type="range" data-path="background.dim" min="0" max="60"></div>
          <div class="field"><label>Background blur</label><input type="range" data-path="background.blur" min="0" max="20"></div>
          <label class="check"><input type="checkbox" data-path="effects.entrance"> Entrance screen</label>
          <div class="field"><label>Entrance title</label><input type="text" data-path="effects.entranceTitle"></div>
          <div class="field"><label>Entrance subtitle</label><input type="text" data-path="effects.entranceSub"></div>
          <label class="check"><input type="checkbox" data-path="effects.cursor"> Custom cursor</label>
          <div class="field">
            <label>Cursor style</label>
            <select data-path="effects.cursorStyle">
              <option value="ring">Ring</option>
              <option value="trail">Trail</option>
            </select>
          </div>
        </div>

        <!-- WIDGETS -->
        <div class="tab-panel" data-panel="widgets">
          <h3>Widgets</h3>
          <label class="check"><input type="checkbox" data-path="widgets.viewCounter"> View counter</label>
          <label class="check"><input type="checkbox" data-path="widgets.discord.enabled"> Discord widget</label>
          <div class="field"><label>Discord username</label><input type="text" data-path="widgets.discord.username"></div>
          <div class="field"><label>Discord invite</label><input type="text" data-path="widgets.discord.inviteUrl"></div>
          <label class="check"><input type="checkbox" data-path="widgets.countdown.enabled"> Countdown</label>
          <div class="field"><label>Countdown target</label><input type="text" data-path="widgets.countdown.target" placeholder="2026-12-31T23:59:59"></div>
        </div>

        <!-- LINKS -->
        <div class="tab-panel" data-panel="links">
          <h3>Link your profiles</h3>
          <p style="font-size:12px;color:var(--text-dim);margin:0 0 12px;line-height:1.4;">Pick a platform, paste your URL. Same idea as guns.lol — every major network is here.</p>
          <div class="field" style="margin-bottom:10px;">
            <input type="search" id="platform-search" placeholder="Search platforms…" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);">
          </div>
          <div id="platform-grid" class="platform-grid"></div>
          <h3 style="margin-top:18px;">Your active links</h3>
          <div id="socials-list"></div>
          <button class="btn" id="add-social" style="width:100%;justify-content:center;margin-top:8px;">+ Custom URL</button>
        </div>

        <!-- AUDIO -->
        <div class="tab-panel" data-panel="audio">
          <h3>Audio</h3>
          <label class="check"><input type="checkbox" data-path="audio.enabled"> Enable player</label>
          <label class="check"><input type="checkbox" data-path="audio.autoplay"> Autoplay</label>
          <div class="field"><label>Volume</label><input type="range" data-path="audio.volume" min="0" max="100"></div>
          <h3 style="margin-top:18px;">Tracks</h3>
          <div id="tracks-list"></div>
          <button class="btn" id="add-track" style="width:100%;justify-content:center;margin-top:6px;">+ Add track</button>
        </div>

        <!-- SEO -->
        <div class="tab-panel" data-panel="seo">
          <h3>SEO & Meta</h3>
          <div class="field"><label>Page title</label><input type="text" data-path="meta.title"></div>
          <div class="field"><label>Description</label><textarea data-path="meta.description"></textarea></div>
          <div class="field">
            <label>Favicon</label>
            <div class="upload-row">
              <input type="text" data-path="meta.favicon" placeholder="URL or upload">
              <button class="btn" onclick="uploadImage('meta.favicon')">Upload</button>
            </div>
          </div>
          <div class="field">
            <label>OG Image</label>
            <div class="upload-row">
              <input type="text" data-path="meta.ogImage" placeholder="URL or upload">
              <button class="btn" onclick="uploadImage('meta.ogImage')">Upload</button>
            </div>
          </div>
        </div>
      </div>

      <div class="preview-area">
        <div class="phone-frame">
          <iframe id="preview-iframe" title="Live preview"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/render-client.js"></script>
<script>
let cfg = null, myHandle = '', saveTimer = null, previewTimer = null, lastPreview = 0;
let clickStats = {};
let performanceMode = localStorage.getItem('vex-perf') === '1';

function updateCompletion(){
  if(!cfg) return;
  const checks = [
    { ok: !!(cfg.identity?.display), label: 'Display name' },
    { ok: !!(cfg.identity?.bio && cfg.identity.bio.length > 8 && !/still setting things up/i.test(cfg.identity.bio)), label: 'Custom bio' },
    { ok: !!(cfg.identity?.avatarImg), label: 'Avatar image' },
    { ok: !!(cfg.identity?.bannerImg), label: 'Banner image' },
    { ok: !!(cfg.socials && cfg.socials.length), label: 'At least one social link' },
    { ok: !!(cfg.identity?.location), label: 'Location' },
    { ok: !!(cfg.audio?.tracks && cfg.audio.tracks.length), label: 'Audio track (optional)', optional: true },
    { ok: !!(cfg.widgets?.badges && cfg.widgets.badges.length), label: 'Badge (optional)', optional: true },
  ];
  const required = checks.filter(c=>!c.optional);
  const done = required.filter(c=>c.ok).length;
  const pct = Math.round((done/required.length)*100);
  const pctEl = document.getElementById('completion-pct');
  const bar = document.getElementById('completion-bar');
  const list = document.getElementById('completion-list');
  if(pctEl) pctEl.textContent = pct+'%';
  if(bar) bar.style.width = pct+'%';
  if(list) list.innerHTML = checks.map(c=>`<li style="color:${c.ok?'var(--ok)':'var(--text-dim)'}">${c.ok?'✓':'○'} ${c.label}</li>`).join('');
  const cs = document.getElementById('click-stats');
  if(cs){
    const entries = Object.entries(clickStats||{});
    if(!entries.length) cs.textContent = 'Link clicks: none yet — share your profile';
    else cs.innerHTML = 'Link clicks: '+entries.map(([k,v])=>`<strong style="color:var(--text)">${k}</strong> ${v}`).join(' · ');
  }
}

function getPath(obj, path){ return path.split('.').reduce((o,k)=>o?.[k], obj); }
function setPath(obj, path, val){
  const keys = path.split('.'); let o = obj;
  for(let i=0;i<keys.length-1;i++){ if(!o[keys[i]]) o[keys[i]]={}; o=o[keys[i]]; }
  o[keys[keys.length-1]] = val;
}

async function init(){
  try{
    const meRes = await fetch('/api/me');
    if(!meRes.ok){ location.href='/login'; return; }
    const me = await meRes.json();
    myHandle = me.handle;
    const profileRes = await fetch('/api/profile');
    const data = await profileRes.json();
    cfg = data.config;
    clickStats = data.clicks || {};
    document.getElementById('gate').style.display='none';
    document.getElementById('shell').style.display='flex';
    const origin = location.origin;
    document.getElementById('live-link').href = origin+'/u/'+myHandle;
    document.getElementById('live-link').textContent = origin+'/u/'+myHandle;
    bindInputs(); renderSocials(); renderTracks(); updateCompletion(); updatePreview(true); setPerformanceMode(performanceMode);
  }catch(e){ console.error(e); document.getElementById('gate').textContent='Failed to load'; }
}

function bindInputs(){
  document.querySelectorAll('[data-path]').forEach(el=>{
    const path = el.dataset.path;
    const val = getPath(cfg, path);
    if(el.type==='checkbox'){
      el.checked = !!val;
      el.addEventListener('change',()=>{ setPath(cfg,path,el.checked); scheduleUpdate(); });
    }else{
      if(val!==undefined && val!==null) el.value = val;
      el.addEventListener('input',()=>{
        let v = el.value;
        if(el.type==='range') v = Number(v);
        setPath(cfg,path,v); scheduleUpdate();
      });
    }
  });
  const tagInput = document.getElementById('taglines-input');
  if(tagInput && cfg.identity?.taglines){
    tagInput.value = cfg.identity.taglines.join('\n');
    tagInput.addEventListener('input',()=>{
      cfg.identity.taglines = tagInput.value.split('\n').map(s=>s.trim()).filter(Boolean);
      scheduleUpdate();
    });
  }
}

function scheduleUpdate(){
  updateCompletion();
  scheduleSave();
  clearTimeout(previewTimer);
  previewTimer = setTimeout(()=>updatePreview(false), performanceMode?420:260);
}
function scheduleSave(){
  clearTimeout(saveTimer);
  document.getElementById('save-label').textContent='saving…';
  document.getElementById('save-dot').style.background='var(--accent2)';
  saveTimer = setTimeout(async()=>{
    try{
      const res = await fetch('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
      if(!res.ok) throw new Error();
      document.getElementById('save-label').textContent='saved';
      document.getElementById('save-dot').style.background='var(--ok)';
    }catch(e){
      document.getElementById('save-label').textContent='save failed';
      document.getElementById('save-dot').style.background='var(--danger)';
    }
  },600);
}
function updatePreview(force=false){
  const now = Date.now();
  if(!force && now-lastPreview < (performanceMode?380:200)) return;
  lastPreview = now;
  const iframe = document.getElementById('preview-iframe');
  if(!iframe || !window.buildPublicHTML) return;
  try{ iframe.srcdoc = window.buildPublicHTML(cfg,{views:0}); }catch(e){ console.warn(e); }
}
function setPerformanceMode(on){
  performanceMode = on;
  localStorage.setItem('vex-perf', on?'1':'0');
  document.getElementById('perf-btn').textContent = on?'Perf: ON':'Perf: OFF';
}
document.getElementById('perf-btn').addEventListener('click',()=>setPerformanceMode(!performanceMode));
document.getElementById('logout-btn').addEventListener('click',async()=>{
  await fetch('/api/auth/logout',{method:'POST'}); location.href='/login';
});
document.querySelectorAll('.tab-btn[data-tab]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    const panel = document.querySelector('.tab-panel[data-panel="'+btn.dataset.tab+'"]');
    if(panel) panel.classList.add('active');
  });
});

async function uploadImage(path){
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = async()=>{
    if(!input.files[0]) return;
    const fd = new FormData(); fd.append('file',input.files[0]);
    try{
      const res = await fetch('/api/upload',{method:'POST',body:fd});
      const data = await res.json();
      if(!res.ok) throw new Error(data.error||'Upload failed');
      setPath(cfg,path,data.url);
      const el = document.querySelector(`input[data-path="${path}"]`);
      if(el) el.value = data.url;
      scheduleUpdate();
    }catch(e){ alert('Upload failed: '+e.message); }
  };
  input.click();
}

function renderPlatformGrid(filter=''){
  const grid = document.getElementById('platform-grid');
  if(!grid) return;
  const q = filter.trim().toLowerCase();
  const active = new Set((cfg.socials||[]).map(s=>(s.platform||'').toLowerCase()));
  const items = PLATFORM_CATALOG.filter(p=>!q || p.name.toLowerCase().includes(q) || p.id.includes(q));
  grid.innerHTML = items.map(p=>`
    <button type="button" class="platform-chip${active.has(p.id)?' active':''}" data-add-platform="${p.id}" title="${p.name}">
      <span class="p-icon">${platformIconSVG(p.id)}</span>
      <span class="p-name">${p.name}</span>
    </button>
  `).join('');
  grid.querySelectorAll('[data-add-platform]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.addPlatform;
      const meta = platformMeta(id);
      if(!cfg.socials) cfg.socials=[];
      const existing = cfg.socials.findIndex(s=>(s.platform||'').toLowerCase()===id);
      if(existing>=0){
        // focus existing — just re-render
        renderSocials();
        const inputs = document.querySelectorAll('#socials-list input[data-social-key="url"]');
        if(inputs[existing]) inputs[existing].focus();
        return;
      }
      const url = prompt('Paste your '+meta.name+' link:', meta.ph.startsWith('http')||meta.ph.startsWith('mailto')?'':'');
      if(url===null) return;
      cfg.socials.push({ platform:id, url:(url||'').trim(), label:meta.name });
      renderSocials(); scheduleUpdate();
    });
  });
}

function renderSocials(){
  const list = document.getElementById('socials-list');
  if(!list) return;
  if(!cfg.socials) cfg.socials=[];
  if(!cfg.socials.length){
    list.innerHTML = '<p style="font-size:12px;color:var(--text-dim);margin:0 0 8px;">No links yet — click a platform above.</p>';
  } else {
    list.innerHTML = cfg.socials.map((s,i)=>{
      const meta = platformMeta(s.platform);
      return `
      <div class="social-active-row">
        <div class="sa-icon">${platformIconSVG(meta.id)}</div>
        <div class="sa-fields">
          <input type="text" value="${(s.label||meta.name||s.platform||'').replace(/"/g,'&quot;')}" data-social-i="${i}" data-social-key="label" placeholder="Label">
          <input type="text" value="${(s.url||'').replace(/"/g,'&quot;')}" data-social-i="${i}" data-social-key="url" placeholder="${meta.ph}">
          <input type="hidden" value="${(s.platform||'website').replace(/"/g,'&quot;')}" data-social-i="${i}" data-social-key="platform">
        </div>
        <button type="button" class="sa-remove" onclick="removeSocial(${i})" title="Remove">×</button>
      </div>`;
    }).join('');
  }
  list.querySelectorAll('[data-social-i]').forEach(el=>{
    el.addEventListener('input',()=>{
      const i=Number(el.dataset.socialI), key=el.dataset.socialKey;
      if(!cfg.socials[i]) cfg.socials[i]={};
      cfg.socials[i][key]=el.value; scheduleUpdate();
      if(key==='platform') renderPlatformGrid(document.getElementById('platform-search')?.value||'');
    });
  });
  renderPlatformGrid(document.getElementById('platform-search')?.value||'');
}
window.removeSocial = function(i){ cfg.socials.splice(i,1); renderSocials(); scheduleUpdate(); };
document.getElementById('add-social')?.addEventListener('click',()=>{
  if(!cfg.socials) cfg.socials=[];
  const url = prompt('Custom URL:','https://');
  if(url===null) return;
  cfg.socials.push({platform:'website', url:(url||'').trim(), label:'Website'});
  renderSocials(); scheduleUpdate();
});
document.getElementById('platform-search')?.addEventListener('input', e=>{
  renderPlatformGrid(e.target.value||'');
});

function renderTracks(){
  const list = document.getElementById('tracks-list');
  if(!list) return;
  if(!cfg.audio) cfg.audio={enabled:false,autoplay:false,volume:60,tracks:[]};
  if(!cfg.audio.tracks) cfg.audio.tracks=[];
  list.innerHTML = cfg.audio.tracks.map((t,i)=>`
    <div class="card-block">
      <div class="field" style="margin-bottom:6px;"><label>Title</label>
        <input type="text" value="${t.title||''}" data-track-i="${i}" data-track-key="title">
      </div>
      <div class="field" style="margin-bottom:6px;"><label>Artist</label>
        <input type="text" value="${t.artist||''}" data-track-i="${i}" data-track-key="artist">
      </div>
      <div class="field" style="margin-bottom:6px;"><label>URL (mp3 / YouTube)</label>
        <input type="text" value="${t.url||''}" data-track-i="${i}" data-track-key="url">
      </div>
      <button class="btn" onclick="removeTrack(${i})" style="width:100%;justify-content:center;color:var(--danger);">Remove</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-track-i]').forEach(el=>{
    el.addEventListener('input',()=>{
      const i=Number(el.dataset.trackI), key=el.dataset.trackKey;
      if(!cfg.audio.tracks[i]) cfg.audio.tracks[i]={};
      cfg.audio.tracks[i][key]=el.value; scheduleUpdate();
    });
  });
}
window.removeTrack = function(i){ cfg.audio.tracks.splice(i,1); renderTracks(); scheduleUpdate(); };
document.getElementById('add-track').addEventListener('click',()=>{
  if(!cfg.audio.tracks) cfg.audio.tracks=[];
  cfg.audio.tracks.push({title:'New Track',artist:'Unknown',url:''});
  renderTracks(); scheduleUpdate();
});

init();
</script>
</body>
</html>
