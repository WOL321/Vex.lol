<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>make your profile</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a10;color:#eceef5;font-family:'Manrope',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;
    background-image:radial-gradient(ellipse 60% 40% at 30% 20%, rgba(139,124,246,0.12), transparent 60%), radial-gradient(ellipse 50% 40% at 80% 80%, rgba(246,165,107,0.08), transparent 60%);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,7vw,56px);font-weight:700;letter-spacing:-0.02em;
    background:linear-gradient(120deg,#fff 20%,#8b7cf6 60%,#f6a56b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  p{color:#8a8ea3;margin-top:14px;font-size:15px;max-width:420px;}
  .actions{display:flex;gap:12px;margin-top:36px;}
  a.btn{padding:13px 28px;border-radius:999px;font-size:13px;text-decoration:none;font-weight:600;}
  .primary{background:linear-gradient(135deg,#8b7cf6,#f6a56b);color:#0a0a10;}
  .secondary{border:1px solid rgba(255,255,255,0.16);color:#eceef5;}
</style>
</head>
<body>
  <h1>your profile,<br>your rules.</h1>
  <p>Build a fully custom bio page — live particle backgrounds, real audio, Discord widget, badges — and get your own link in under a minute.</p>
  <div class="actions">
    <a class="btn primary" href="/register">Create yours</a>
    <a class="btn secondary" href="/login">Log in</a>
  </div>
</body>
</html>
