<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vex — your profile, your rules</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a10;
  color:#eceef5;
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  overflow:hidden;
  position:relative;
}
canvas { position:fixed; inset:0; z-index:0; }
.content { position:relative; z-index:2; }
h1 {
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(38px,8vw,68px);
  font-weight:700;
  letter-spacing:-0.03em;
  line-height:1.05;
  background:linear-gradient(120deg,#fff 15%,#9f7aea 50%,#f6a56b 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 80px rgba(159,122,234,0.25);
}
p {
  color:#8a8ea3;
  margin-top:20px;
  font-size:16px;
  max-width:460px;
  line-height:1.6;
}
.actions {
  display:flex;
  gap:14px;
  margin-top:42px;
  justify-content:center;
  flex-wrap:wrap;
}
a.btn {
  padding:15px 34px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  transition:transform .15s, box-shadow .15s;
}
a.btn:hover { transform:translateY(-2px); }
.primary {
  background:linear-gradient(135deg,#9f7aea,#f6a56b);
  color:#0a0a10;
  box-shadow:0 10px 40px -10px rgba(159,122,234,0.55);
}
.secondary {
  border:1px solid rgba(255,255,255,0.15);
  color:#eceef5;
  background:rgba(255,255,255,0.03);
}
.secondary:hover { background:rgba(255,255,255,0.07); }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="content">
  <h1>your profile,<br>your rules.</h1>
  <p>Build a fully custom bio page — live particle backgrounds, real audio, Discord widget, badges — and get your own link in under a minute.</p>
  <div class="actions">
    <a class="btn primary" href="/register">Create yours</a>
    <a class="btn secondary" href="/login">Log in</a>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const COUNT = 110;
  const mouse = { x:-9999, y:-9999 };
  const ACCENT = [159, 122, 234];

  function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  resize();
  addEventListener('resize', resize);

  for(let i=0;i<COUNT;i++){
    particles.push({
      x: Math.random()*W,
      y: Math.random()*H,
      vx: (Math.random()-0.5)*0.45,
      vy: (Math.random()-0.5)*0.45,
      r: Math.random()*2.1 + 0.7
    });
  }

  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  function draw(){
    ctx.clearRect(0,0,W,H);

    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < 160){
        const force = (160 - dist) / 160;
        p.vx += (dx / dist) * force * 2.1;
        p.vy += (dy / dist) * force * 2.1;
      }

      p.vx *= 0.975;
      p.vy *= 0.975;
      p.x += p.vx;
      p.y += p.vy;

      if(p.x < -12) p.x = W+12;
      if(p.x > W+12) p.x = -12;
      if(p.y < -12) p.y = H+12;
      if(p.y > H+12) p.y = -12;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},0.6)`;
      ctx.fill();
    }

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a = particles[i], b = particles[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if(d < 130){
          ctx.beginPath();
          ctx.strokeStyle = `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${0.14*(1-d/130)})`;
          ctx.lineWidth = 0.7;
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
