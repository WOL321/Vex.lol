<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>profile builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --e-bg:#0b0c11; --e-panel:#111219; --e-panel-2:#15161f;
    --e-border:rgba(255,255,255,0.08); --e-border-hi:rgba(255,255,255,0.16);
    --e-text:#eceef5; --e-dim:#8a8ea3; --e-faint:#565a70;
    --e-accent:#8b7cf6; --e-accent2:#f6a56b; --e-ok:#7fd8a6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--e-bg); color:var(--e-text); font-family:'Manrope',sans-serif; overflow:hidden; }
  ::selection{ background:var(--e-accent); color:#0a0a10; }
  input,select,textarea,button{ font-family:inherit; }
  .app-shell{ display:flex; height:100vh; width:100vw; }

  .rail{
    width:74px; flex-shrink:0; background:var(--e-panel); border-right:1px solid var(--e-border);
    display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:2px; overflow-y:auto;
  }
  .rail::-webkit-scrollbar{ width:0; }
  .rail-logo{
    width:34px; height:34px; border-radius:9px; margin-bottom:10px;
    background:linear-gradient(135deg,var(--e-accent),var(--e-accent2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#0a0a10; flex-shrink:0;
  }
  .tab-btn{
    width:58px; padding:9px 0 7px; border:none; background:transparent; color:var(--e-faint);
    border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:9px; letter-spacing:.02em; transition:background .2s ease, color .2s ease; flex-shrink:0;
  }
  .tab-btn svg{ width:17px; height:17px; }
  .tab-btn:hover{ background:rgba(255,255,255,0.04); color:var(--e-text); }
  .tab-btn.active{ background:rgba(139,124,246,0.14); color:var(--e-accent); }

  .settings{ width:380px; flex-shrink:0; background:var(--e-panel-2); border-right:1px solid var(--e-border); display:flex; flex-direction:column; height:100%; }
  .settings-header{ padding:18px 22px 12px; border-bottom:1px solid var(--e-border); }
  .settings-header h1{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; }
  .settings-header p{ font-size:11px; color:var(--e-faint); margin-top:2px; }
  .settings-body{ flex:1; overflow-y:auto; padding:18px 22px 40px; }
  .settings-body::-webkit-scrollbar{ width:6px; }
  .settings-body::-webkit-scrollbar-thumb{ background:var(--e-border-hi); border-radius:3px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--e-dim); margin-bottom:6px; font-family:'JetBrains Mono',monospace; }
  .field input[type=text], .field input[type=url], .field input[type=number], .field input[type=datetime-local], .field textarea, .field select{
    width:100%; background:var(--e-panel); border:1px solid var(--e-border); color:var(--e-text);
    padding:9px 11px; border-radius:9px; font-size:12.5px; outline:none; transition:border-color .2s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--e-accent); }
  .field textarea{ resize:vertical; min-height:60px; line-height:1.5; }
  .hint{ font-size:10px; color:var(--e-faint); margin-top:4px; }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; }

  .color-field{ display:flex; align-items:center; gap:8px; }
  .color-field input[type=color]{ width:36px; height:36px; border-radius:9px; border:1px solid var(--e-border); background:none; cursor:pointer; padding:2px; }
  .color-field input[type=text]{ flex:1; font-family:'JetBrains Mono',monospace; font-size:11.5px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--e-border); }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle-row span{ font-size:12.5px; }
  .switch{ position:relative; width:36px; height:21px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:rgba(255,255,255,0.1); border-radius:99px; cursor:pointer; transition:background .2s ease; }
  .slider::before{ content:''; position:absolute; width:15px; height:15px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s ease; }
  .switch input:checked + .slider{ background:var(--e-accent); }
  .switch input:checked + .slider::before{ transform:translateX(15px); }

  .segmented{ display:flex; flex-wrap:wrap; background:var(--e-panel); border:1px solid var(--e-border); border-radius:9px; padding:3px; gap:3px; }
  .segmented button{ flex:1; min-width:70px; padding:7px 4px; border:none; background:transparent; color:var(--e-dim); border-radius:7px; font-size:10.5px; cursor:pointer; transition:background .2s ease,color .2s ease; }
  .segmented button.active{ background:var(--e-accent); color:#0a0a10; font-weight:600; }

  .range-field{ display:flex; align-items:center; gap:10px; }
  .range-field input[type=range]{ flex:1; accent-color:var(--e-accent); }
  .range-field .range-val{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--e-dim); width:32px; text-align:right; }

  .section-title{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--e-accent2); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ padding:7px 11px; border-radius:99px; border:1px solid var(--e-border); background:var(--e-panel); color:var(--e-dim); font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:border-color .2s ease,color .2s ease,background .2s ease; }
  .chip.active{ border-color:var(--e-accent); color:var(--e-text); background:rgba(139,124,246,0.14); }

  .list-row{ display:flex; align-items:center; gap:7px; margin-bottom:8px; background:var(--e-panel); border:1px solid var(--e-border); border-radius:9px; padding:8px; }
  .list-row select{ width:104px; flex-shrink:0; padding:8px; font-size:11.5px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:7px; color:var(--e-text); }
  .list-row input{ flex:1; min-width:0; padding:8px 9px; font-size:11.5px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:7px; color:var(--e-text); outline:none; }
  .list-row-stack{ display:flex; flex-direction:column; gap:6px; background:var(--e-panel); border:1px solid var(--e-border); border-radius:9px; padding:9px; margin-bottom:8px; }
  .list-row-stack .lr-top{ display:flex; gap:6px; }
  .list-row-stack input{ flex:1; min-width:0; padding:8px 9px; font-size:11.5px; background:var(--e-panel-2); border:1px solid var(--e-border); border-radius:7px; color:var(--e-text); outline:none; }
  .icon-btn{ width:28px; height:28px; flex-shrink:0; border-radius:7px; border:1px solid var(--e-border); background:var(--e-panel-2); color:var(--e-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:hover{ color:#ff8484; border-color:#ff8484; }
  .icon-btn svg{ width:13px; height:13px; }
  .add-btn{ width:100%; padding:9px; border:1px dashed var(--e-border-hi); background:transparent; color:var(--e-dim); border-radius:9px; cursor:pointer; font-size:12px; margin-top:2px; transition:border-color .2s ease,color .2s ease; }
  .add-btn:hover{ border-color:var(--e-accent); color:var(--e-accent); }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{ height:54px; flex-shrink:0; border-bottom:1px solid var(--e-border); display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--e-panel); }
  .topbar-left{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--e-dim); }
  .save-dot{ width:7px; height:7px; border-radius:50%; background:var(--e-ok); transition:background .3s ease; }
  .topbar-right{ display:flex; gap:8px; }
  .btn{ padding:8px 14px; border-radius:8px; font-size:12px; border:1px solid var(--e-border-hi); background:transparent; color:var(--e-text); cursor:pointer; display:flex; align-items:center; gap:6px; transition:border-color .2s ease; }
  .btn:hover{ border-color:var(--e-accent); }
  .btn.primary{ background:linear-gradient(135deg,var(--e-accent),var(--e-accent2)); color:#0a0a10; border:none; font-weight:600; }
  .btn svg{ width:13px; height:13px; }

  .preview-wrap{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 20%, rgba(139,124,246,0.06), transparent 55%), repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 22px);
    padding:26px; }
  .phone-frame{ width:390px; height:780px; border-radius:38px; padding:12px; background:#050505; box-shadow:0 40px 100px -30px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05); position:relative; flex-shrink:0; }
  .phone-frame::before{ content:''; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:110px; height:22px; background:#050505; border-radius:0 0 16px 16px; z-index:2; }
  .phone-frame iframe{ width:100%; height:100%; border:none; border-radius:28px; background:#0a0a10; }

  .fullscreen-frame{ display:none; position:fixed; inset:0; z-index:100; background:#0a0a10; }
  .fullscreen-frame.show{ display:block; }
  .fullscreen-frame iframe{ width:100%; height:100%; border:none; }
  .exit-fs{ position:fixed; top:16px; right:16px; z-index:101; padding:9px 16px; border-radius:8px; background:rgba(20,20,28,0.85); border:1px solid var(--e-border-hi); color:#fff; font-size:12px; cursor:pointer; backdrop-filter:blur(8px); }

  @media (max-width: 900px){ .settings{ width:310px; } .phone-frame{ transform:scale(0.82); } }
</style>
</head>

    <div class="preview-wrap"><div class="phone-frame"><iframe id="preview-iframe" title="live preview"></iframe></div></div>
  </div>
</div>

<div class="fullscreen-frame" id="fullscreen-frame">

</div>
