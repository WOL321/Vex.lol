<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>log in</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a10;color:#eceef5;font-family:'Manrope',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background-image:radial-gradient(ellipse 60% 40% at 30% 20%, rgba(139,124,246,0.12), transparent 60%);}
  .box{width:100%;max-width:360px;background:rgba(19,20,32,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 28px;backdrop-filter:blur(20px);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:24px;}
  label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#8a8ea3;margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  .field{margin-bottom:16px;}
  input{width:100%;background:#111219;border:1px solid rgba(255,255,255,0.08);color:#eceef5;padding:11px 12px;border-radius:9px;font-size:13px;outline:none;}
  input:focus{border-color:#8b7cf6;}
  button{width:100%;padding:12px;border-radius:9px;border:none;background:linear-gradient(135deg,#8b7cf6,#f6a56b);color:#0a0a10;font-weight:600;font-size:13px;cursor:pointer;margin-top:6px;}
  .err{color:#ff8484;font-size:12.5px;margin-top:10px;min-height:16px;}
  .foot{text-align:center;margin-top:18px;font-size:12.5px;color:#8a8ea3;}
  .foot a{color:#8b7cf6;text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <h1>Welcome back</h1>
    <form id="form">
      <div class="field"><label>Handle or email</label><input type="text" id="identifier" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" required></div>
      <button type="submit">Log in</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot">No account? <a href="/register">Create one</a></div>
  </div>
<script>
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('err').textContent = '';
    const body = { identifier: document.getElementById('identifier').value.trim(), password: document.getElementById('password').value };
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { document.getElementById('err').textContent = data.error || 'Login failed'; return; }
    location.href = '/dashboard';
  });
</script>
</body>
</html>
